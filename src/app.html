<title>담을자리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 모바일 앱 — 상단 제목, 가운데 한 화면, 하단 탭. 장소 번호는 실제 걷는 순서. */
:root{
  --bg:#ECEDE8; --surface:#F8F8F4; --sunk:#E2E4DD; --line:#CBCFC4; --ink:#1B2430; --muted:#5B6370;
  --accent:#23407F; --on-accent:#F8F8F4; --accent-soft:#D9E0F0; --ochre:#9E6A17; --good:#2D7448; --bad:#AD3535;
  --display:"Gowun Batang",Batang,"AppleMyungjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --navh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161D;--surface:#1A2029;--sunk:#0F1319;--line:#2C3440;--ink:#E5E7E2;--muted:#98A0AB;--accent:#93A9E6;--on-accent:#12161D;--accent-soft:#24304A;--ochre:#D8A552;--good:#6FC08E;--bad:#E58080;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161D;--surface:#1A2029;--sunk:#0F1319;--line:#2C3440;--ink:#E5E7E2;--muted:#98A0AB;--accent:#93A9E6;--on-accent:#12161D;--accent-soft:#24304A;--ochre:#D8A552;--good:#6FC08E;--bad:#E58080;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .in,.main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .in{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em}
.brand i{font-style:normal;color:var(--ochre)}
#hdrSub{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.main{padding-block:18px calc(var(--navh) + 32px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--navh)}
.tabs button{background:none;border:0;font:inherit;font-size:.78rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
h1{font-family:var(--display);font-size:1.6rem;margin:0;line-height:1.25;text-wrap:balance}
h2{font-family:var(--display);font-size:1.15rem;margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.08em;font-weight:600;color:var(--ochre)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.lg{gap:22px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.due{border-color:var(--accent)}
.btn{font:inherit;font-weight:600;padding:10px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;min-height:42px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.85rem;font-weight:500}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-width:0;width:100%}
textarea{resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:500;color:var(--muted)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:transparent;border:1px solid var(--ochre);color:var(--ochre)}
.pill.ok{background:transparent;border:1px solid var(--good);color:var(--good)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ochre);font-size:.85rem;flex:none;min-width:1.8em;text-align:right}
.thumb{width:44px;height:44px;border-radius:6px;background:var(--sunk);border:1px dashed var(--line);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1.1rem;cursor:pointer;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.strip{display:flex;gap:4px;overflow:hidden}
.strip .thumb{width:30px;height:30px;font-size:.7rem;cursor:default;border-style:solid}
.loci{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.loci li{display:flex;gap:8px;align-items:center}
.loci li input[type=text]{flex:1}
.lcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.putl{background:none;border:0;padding:2px 2px;font:inherit;font-size:.82rem;font-weight:500;color:var(--accent);text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.putl.has{color:var(--ink)}
.putl.has b{color:var(--ochre);font-weight:600}
/* 장면 짓기 */
.locus:not(.nophoto){aspect-ratio:4/3;max-height:52vh;max-width:100%}
label.btn{display:inline-flex;align-items:center;justify-content:center}
.locus{position:relative;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line);min-height:120px;display:flex;align-items:flex-end}
.locus img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.locus .cap{position:relative;width:100%;padding:12px 14px;display:flex;align-items:baseline;gap:10px;background:linear-gradient(transparent,rgba(10,14,20,.72));color:#F3F3EE}
.locus.nophoto .cap{background:none;color:var(--ink)}
.locus .cap b{font-family:var(--mono);font-size:1.6rem;color:var(--ochre);font-weight:500}
.locus .cap span{font-size:1rem;font-weight:600}
.item{font-family:var(--display);font-size:2.3rem;font-weight:700;line-height:1.2;word-break:keep-all;text-align:center;padding:10px 0}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots span{width:18px;height:5px;border-radius:2px;background:var(--line)}
.dots .on{background:var(--accent)} .dots .ok{background:var(--good)} .dots .no{background:var(--bad)} .dots .half{background:var(--ochre)}
/* 회상 */
.rc li{display:grid;grid-template-columns:1.8em auto minmax(0,1fr);gap:4px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.rc .pl{font-size:.85rem;color:var(--muted);grid-column:3}
.rc .inrow{grid-column:3;display:flex;gap:6px}
.rc .num{grid-row:span 2}.rc li>span:nth-child(2){grid-row:span 2}.rc .thumb{cursor:default;border-style:solid}
.rc .verdict{grid-column:3;font-size:.85rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ok-t{color:var(--good)} .no-t{color:var(--bad)} .half-t{color:var(--ochre)}
.score{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1}
.empty{border:1px dashed var(--line);border-radius:8px;padding:22px 16px;text-align:center;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:.9rem}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--bad)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.tip{border-left:3px solid var(--ochre);padding:2px 0 2px 12px;font-size:.88rem;color:var(--muted)}
.tip b{color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:.85rem;font-weight:600;padding:9px 4px;background:var(--surface);color:var(--muted);border:0;border-right:1px solid var(--line);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:disabled{opacity:.4;cursor:default}
.rc li.rv,.rc li.ph{grid-template-columns:minmax(0,1fr)}
.rc li.ph .inrow,.rc li.rv select{grid-column:1}
.item-s{font-family:var(--display);font-size:1.25rem;font-weight:700}
.bigph{width:100%;aspect-ratio:4/3;max-height:240px;object-fit:cover;border-radius:6px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.tnum{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.ntgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.nt{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.nt .num{min-width:auto;font-size:.95rem}
.nt .cons{font-size:.75rem;color:var(--muted);min-width:2.2em}
.nt input{padding:5px 7px}
.nt.slow{border-color:var(--ochre);border-width:2px}
.flashnum{font-family:var(--mono);font-size:3.6rem;line-height:1;color:var(--ink)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:2px 10px}
.steps .n{font-family:var(--mono);color:var(--ochre);font-size:1.3rem;line-height:1.3;grid-row:span 2}
.steps b{font-size:1rem}
.uses{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.uses .card h2{font-size:1.05rem}
.uses .card .btn{align-self:flex-start;margin-top:auto}
.fit{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.fit div{border-top:2px solid var(--line);padding-top:8px}
.fit .yes{border-color:var(--good)} .fit .no{border-color:var(--bad)}
.hdrbtn{font:inherit;font-size:.78rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border:0;border-radius:99px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.guidecard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:14px;cursor:pointer}
.guidecard .gq{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:1.2rem}
.guidecard .gt{display:flex;flex-direction:column;gap:2px;min-width:0}
.guidecard .gt b{font-family:var(--display);font-size:1.08rem}
.guidecard .gt span{font-size:.85rem;color:var(--muted)}
.guidecard .ga{color:var(--accent);font-size:1.2rem;font-weight:700}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<header class="top"><div class="in"><div class="brand">담을<i>자리</i></div><div class="row" style="gap:10px;flex-wrap:nowrap"><div id="hdrSub"></div><button class="hdrbtn" id="hdrGuide" aria-label="담을자리 쓰임 안내">쓰임 안내</button></div></div></header>
<main class="main" id="view"></main>
<nav class="tabs" aria-label="화면 이동"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>오늘</button>
  <button data-tab="palaces"><svg viewBox="0 0 24 24"><path d="M4 20V10l8-6 8 6v10"/><path d="M10 20v-5a2 2 0 0 1 4 0v5"/></svg>궁전</button>
  <button data-tab="lists"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>목록</button>
  <button data-tab="drill"><svg viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg>연습</button>
</div></nav>
<div id="toast" role="status"></div>

<script>
/* ===== 데이터 ===== */
const KEY="gieokjari_v1",DAY=864e5,IV=[1,3,7,14,30,60];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const norm=s=>String(s||"").replace(/\s+/g,"").toLowerCase();
const md=t=>{const d=new Date(t);return `${d.getMonth()+1}월 ${d.getDate()}일`};
const rel=t=>{const n=Math.round((t-today())/DAY);return n<=0?"오늘":n===1?"내일":`${n}일 뒤`};
const fmtS=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function seed(){
  const pid=uid();
  return {v:1,palaces:[{id:pid,name:"우리 집 (예시)",loci:["현관문","신발장","거실 소파","텔레비전","베란다 화분","냉장고","가스레인지","식탁","욕실 거울","침대"].map(n=>({id:uid(),name:n,photo:""}))}],
    lists:[{id:uid(),title:"조선 전기 왕 순서 (예시)",palaceId:pid,items:["태조","정종","태종","세종","문종","단종","세조","예종","성종","연산군"].map(t=>({text:t,scene:""})),built:false,stage:-1,due:today(),reviews:[],created:Date.now()}],
    drills:[]};
}
/* 저장: IndexedDB(사진은 따로 보관) → 쓸 수 없으면 localStorage */
const IDB={d:null};
function idbOpen(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open("dameul",1)}catch(e){return rej(e)}r.onupgradeneeded=()=>{const d=r.result;["kv","photos"].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};r.onsuccess=()=>{IDB.d=r.result;res(r.result)};r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("blocked"))})}
function idbReq(store,mode,fn){return new Promise((res,rej)=>{const tx=IDB.d.transaction(store,mode);const q=fn(tx.objectStore(store));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
const idbGet=(n,k)=>idbReq(n,"readonly",st=>st.get(k));
const idbPut=(n,k,v)=>idbReq(n,"readwrite",st=>st.put(v,k));
const idbDel=(n,k)=>idbReq(n,"readwrite",st=>st.delete(k));
function idbAll(n){return new Promise((res,rej)=>{const out={};const tx=IDB.d.transaction(n,"readonly");tx.objectStore(n).openCursor().onsuccess=e=>{const c=e.target.result;if(c){out[c.key]=c.value;c.continue()}};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)})}
const slim=d=>JSON.stringify(d,(k,v)=>k==="photo"?(v?1:0):v);
const photoMap=d=>Object.fromEntries(d.palaces.flatMap(p=>p.loci.map(l=>[l.id,typeof l.photo==="string"?l.photo:""])));
function hydrate(d,photos){d.palaces.forEach(p=>p.loci.forEach(l=>{l.photo=l.photo?(photos[l.id]||""):""}));d.drills=d.drills||[];d.numImg=d.numImg||{};d.numStats=d.numStats||{};d.used=d.used||{};d.flash=d.flash||[];d.settings=Object.assign({notifyOn:false,notifyMode:"none",hour:20},d.settings||{});return d}
let db=null,useIDB=false;
async function load(){
  try{await idbOpen();useIDB=true}catch(e){}
  if(useIDB){try{
    const s=await idbGet("kv","db");
    if(s)return hydrate(JSON.parse(s),await idbAll("photos"));
    let old=null;try{old=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
    if(old&&old.palaces&&old.lists){const map=photoMap(old);for(const[id,ph]of Object.entries(map))if(ph)await idbPut("photos",id,ph);const d=hydrate(old,map);await idbPut("kv","db",slim(d));return d}
    const d=hydrate(seed(),{});await idbPut("kv","db",slim(d));return d;
  }catch(e){useIDB=false}}
  try{const v=localStorage.getItem(KEY);if(v){const d=JSON.parse(v);if(d&&d.palaces&&d.lists)return hydrate(d,photoMap(d))}}catch(e){}
  return hydrate(seed(),{});
}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(flush,250);return true}
async function flush(){
  clearTimeout(saveT);if(!db)return;
  if(useIDB){try{await idbPut("kv","db",slim(db))}catch(e){toast("저장하지 못했습니다. 휴대폰 저장 공간을 확인해 주세요.")}return}
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast("저장 공간이 가득 찼습니다. 사진을 몇 장 지우거나 백업 후 정리해 주세요.")}
}
function putPhoto(id,data){if(useIDB)idbPut("photos",id,data).catch(()=>toast("사진을 저장하지 못했습니다. 저장 공간을 확인해 주세요."))}
function dropPhoto(id){if(useIDB)idbDel("photos",id).catch(()=>{})}
document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
const pal=id=>db.palaces.find(p=>p.id===id);
const active=L=>L.items.map((it,k)=>it.text.trim()?k:-1).filter(k=>k>=0);

/* 간격 반복: 90% 이상이면 한 단계 위로, 60% 미만이면 처음부터 */
function nextOf(L,score){let s=L.stage??-1;if(score>=.9)s=Math.min(s+1,IV.length-1);else if(score>=.6)s=Math.max(s,0);else s=0;return{stage:s,due:today()+IV[s]*DAY}}
function streak(){
  const days=new Set();db.lists.forEach(l=>l.reviews.forEach(r=>{const d=new Date(r.d);d.setHours(0,0,0,0);days.add(d.getTime())}));
  db.drills.forEach(r=>{const d=new Date(r.d);d.setHours(0,0,0,0);days.add(d.getTime())});
  let t=today();if(!days.has(t))t-=DAY;let n=0;while(days.has(t)){n++;t-=DAY}return n;
}

async function shareOrDownload(text,name,type){

async function swReg(){try{return navigator.serviceWorker?await navigator.serviceWorker.getRegistration():null}catch(e){return null}}
async function enableNotify(){
  const say=t=>{const el=$("#nStatus");if(el)el.textContent=t};
  if(isPreview()||!("Notification" in window)){say(notifyStatusText());return}
  let p;try{p=await Notification.requestPermission()}catch(e){p="denied"}
  if(p!=="granted"){say("알림 권한이 허용되지 않았습니다. 휴대폰 설정에서 이 앱의 알림을 허용한 뒤 다시 눌러 주세요.");return}
  const reg=await swReg();let mode="none";
  if(reg&&"periodicSync" in reg){try{const st=await navigator.permissions.query({name:"periodic-background-sync"});if(st.state==="granted"){await reg.periodicSync.register("review-check",{minInterval:4*3600e3});mode="sync"}}catch(e){}}
  db.settings.notifyOn=mode==="sync";db.settings.notifyMode=mode;await flush();render();
  if(mode==="sync"){try{reg.showNotification("담을자리 알림을 켰습니다",{body:`복습할 목록이 있는 날 ${hourLabel(db.settings.hour)} 이후에 알려 드립니다.`,icon:"icons/icon-192.png",tag:"dameul-test"})}catch(e){}toast("복습 알림을 켰습니다")}
  else say(/SamsungBrowser/i.test(navigator.userAgent)?"삼성 인터넷은 정해진 시각에 앱을 깨우는 기능이 없어 알림을 보낼 수 없습니다. 크롬에서 이 주소를 열어 앱으로 설치하거나, 아래 캘린더 알림을 써 주세요.":!(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)?"홈 화면에 설치한 앱에서만 알림을 켤 수 있습니다. 크롬 ⋮ 메뉴의 ‘앱 설치’로 설치한 뒤 다시 눌러 주세요.":"크롬이 아직 이 앱의 백그라운드 확인을 허락하지 않았습니다. 며칠 자주 쓰면 허락되는 경우가 많습니다. 그동안은 아래 캘린더 알림을 써 주세요.");

/* ----- 장면 짓기 ----- */
const curList=()=>V.temp||lst(V.id);
VIEWS.build=()=>{
  const L=curList(),P=pal(L.palaceId),act=V.temp?[...L.items.keys()]:active(L),n=act.length;if(!n)return go("place",{pid:L.palaceId,i:0,lid:L.id});const pos=Math.min(V.i||0,n-1),i=act[pos],it=L.items[i],loc=P.loci[i]||{name:"(장소 없음)"};
  view().innerHTML=`<div class="stack">
    <div class="row between"><div class="eyebrow">궁전에 담기 · ${esc(L.title)}</div><span class="small muted">${V.temp&&V.temp.limit?`<b id="cd" class="tnum"></b> · `:""}${pos+1} / ${n}</span></div>
    <div class="dots">${act.map((_,p)=>`<span class="${p<=pos?"on":""}"></span>`).join("")}</div>
    <div class="locus ${loc.photo?"":"nophoto"}">${loc.photo?`<img src="${loc.photo}" alt="">`:""}<div class="cap"><b>${String(i+1).padStart(2,"0")}</b><span>${esc(loc.name)}</span></div></div>
    <div class="item">${esc(it.text)}</div>
    ${isNumTemp()?`<div class="row" style="justify-content:center;gap:10px">${db.settings.numHint===false?"":`<span class="small muted">${chunks(it.text).map(c=>`${c} ${db.numImg[c]?esc(db.numImg[c]):"(짝표 없음)"}`).join(" · ")}</span>`}<button class="putl" id="nh">짝표 ${db.settings.numHint===false?"보기":"숨기기"}</button></div>`:""}
    <label class="f">이 자리에 어떻게 담을까요<textarea id="scene" rows="3" placeholder="크게, 움직이게, 소리나 냄새까지. 예: ${esc(loc.name)}에서 ${esc(it.text)}이(가) 튀어나와 …">${esc(it.scene)}</textarea></label>
    <div class="row"><button class="btn plain" id="prev" ${pos?"":"disabled"}>이전</button>${pos<n-1?`<button class="btn" id="next">다음 장소</button>`:`<button class="btn" id="done">다 담았어요 · 떠올리기</button>`}</div>
    ${pos===0&&!L.built?`<div class="tip"><b>직접 담는 게 핵심입니다.</b> 사진 속 자리의 생김새와 외울 것이 엉뚱하게 부딪치는 모습을 떠올리세요. 글로 적으면 한 번 더 상상하게 되어 오래 남습니다. 비워 두고 넘어가도 됩니다.</div>`:""}
  </div>`;
  on("#scene","input",(e,t)=>{it.scene=t.value;if(!V.temp)save()});
  on("#prev","click",()=>{V.i=pos-1;render()});on("#next","click",()=>{V.i=pos+1;render()});
  on("#done","click",()=>{if(!V.temp){L.built=true;save()}startRecall(L,V.temp)});
  on("#nh","click",()=>{db.settings.numHint=db.settings.numHint===false;save();render()});
  if(V.temp&&V.temp.limit){const tick=()=>{const left=Math.max(0,Math.ceil(V.temp.limit-(Date.now()-V.t0)/1000));const el=$("#cd");if(el){el.textContent=fmtS(left)+" 남음";el.className=left<=10?"tnum no-t":"tnum"}if(left<=0){clearInterval(CD);toast("담는 시간이 끝났습니다");startRecall(L,V.temp)}};clearInterval(CD);CD=setInterval(tick,250);tick()}
};
const MODES=[["seq","순서대로"],["shuf","섞어서"],["rev","거꾸로"],["photo","사진만"]];
const MODE_TITLE={seq:"첫 자리부터 다시 걸어 보세요",shuf:"번호를 섞었습니다. 그 자리로 곧장 가 보세요",rev:"이것을 어느 자리에 담았나요",photo:"사진 속 자리에 무엇을 담았나요"};
const MODE_NOTE={seq:"떠오르지 않으면 자리의 생김새를 먼저 떠올려 보세요.",shuf:"앞 자리에 기대지 않고 한 자리로 바로 들어가는 연습입니다.",rev:"담은 것을 보고 자리를 고릅니다. 궁전 안을 거꾸로 찾아가는 연습입니다.",photo:"자리 이름과 번호 없이 사진만 보고 떠올립니다."};
const photoOK=L=>{const P=pal(L.palaceId);return active(L).every(k=>P.loci[k]&&P.loci[k].photo)};
function pickMode(L){const n=(L.reviews||[]).length;if(!n)return"seq";const avail=MODES.map(m=>m[0]).filter(m=>m!=="photo"||photoOK(L));return avail[n%avail.length]}
function recallState(L,mode){const idx=V.temp&&V.temp===L?[...L.items.keys()]:active(L);return{mode,order:mode==="seq"?idx:shuffle(idx),ans:L.items.map(()=>""),hint:L.items.map(()=>false)}}
function startRecall(L,temp){go("recall",{id:L.id,temp:temp||null,t1:Date.now(),t0:V.t0,...recallState(L,temp?"seq":pickMode(L))})}

/* ----- 떠올리기 ----- */
VIEWS.recall=()=>{
  const L=curList(),P=pal(L.palaceId),m=V.mode,pOK=photoOK(L);
  const row=k=>{const it=L.items[k],loc=P.loci[k]||{};
    if(m==="rev")return `<li class="rv"><span class="item-s">${esc(it.text)}</span><select id="rc-${k}" aria-label="${esc(it.text)}을(를) 담은 자리"><option value="">어느 자리에 담았나요?</option>${active(L).map(j=>`<option value="${j}" ${V.ans[k]===String(j)?"selected":""}>${j+1}. ${esc(P.loci[j]?.name||"")}</option>`).join("")}</select></li>`;
    const input=`<span class="inrow"><input type="text" id="rc-${k}" autocomplete="off" value="${esc(V.ans[k])}" aria-label="${m==="photo"?"이 사진 속 자리에 담은 것":`${k+1}번 ${esc(loc.name)}`}"><button class="btn sm plain" data-h="${k}" ${V.hint[k]?"disabled":""}>${V.hint[k]?esc([...it.text][0])+"…":"첫 글자"}</button></span>`;
    if(m==="photo")return `<li class="ph"><img class="bigph" src="${loc.photo}" alt="">${input}</li>`;
    return `<li><span class="num">${k+1}</span>${rcThumb(loc)}<span class="pl">${esc(loc.name)}</span>${input}</li>`};
  view().innerHTML=`<div class="stack">
    <div class="stack" style="gap:4px"><div class="eyebrow">떠올리기 · ${esc(L.title)}</div><h1>${MODE_TITLE[m]}</h1>
    <div class="small muted">${MODE_NOTE[m]}${m!=="rev"?" ‘첫 글자’ 힌트를 쓰면 반점으로 계산합니다.":""}</div></div>
    <div class="seg" role="radiogroup" aria-label="떠올리기 방식">${MODES.map(([k,lab])=>`<button role="radio" aria-checked="${k===m}" data-mode="${k}" ${k==="photo"&&!pOK?"disabled":""}>${lab}</button>`).join("")}</div>
    ${!pOK?`<div class="small muted">‘사진만’은 이 목록이 쓰는 모든 자리에 사진이 있어야 고를 수 있습니다.</div>`:V.temp?"":`<div class="small muted">복습할 때마다 방식이 바뀝니다. 위에서 직접 고를 수도 있습니다.</div>`}
    <ol class="loci rc">${V.order.map(row).join("")}</ol>
    <button class="btn wide" id="grade">채점</button>
  </div>`;
  on("[data-mode]","click",(e,b)=>{if(b.dataset.mode===m)return;Object.assign(V,recallState(L,b.dataset.mode));V.t1=Date.now();render();window.scrollTo(0,0)});
  on("input[id^=rc-]","input",(e,t)=>V.ans[+t.id.slice(3)]=t.value);
  on("select[id^=rc-]","change",(e,t)=>V.ans[+t.id.slice(3)]=t.value);
  on("input[id^=rc-]","keydown",(e,t)=>{if(e.key==="Enter"){e.preventDefault();const pos=V.order.indexOf(+t.id.slice(3));const nx=$("#rc-"+V.order[pos+1]);nx?nx.focus():$("#grade").focus()}});
  on("[data-h]","click",(e,b)=>{const k=+b.dataset.h;V.hint[k]=true;b.textContent=[...L.items[k].text][0]+"…";b.disabled=true;$("#rc-"+k).focus()});
  on("#grade","click",()=>{V.res=L.items.map((it,k)=>m==="rev"?V.ans[k]===String(k):norm(V.ans[k])===norm(it.text));V.secs=Math.round((Date.now()-V.t1)/1000);V.name="result";render();window.scrollTo(0,0)});
  const f=$("#rc-"+V.order[0]);if(f&&m!=="rev"&&!V.ans.some(Boolean))f.focus();
};

/* ----- 결과 ----- */
VIEWS.result=()=>{
  const L=curList(),P=pal(L.palaceId),act=V.order.slice().sort((a,b)=>a-b),n=act.length,m=V.mode,ML=MODES.find(x=>x[0]===m)[1];
  const pts=act.map(k=>V.res[k]?(V.hint[k]?.5:1):0);const score=pts.reduce((a,b)=>a+b,0)/n;
  const nx=V.temp?null:nextOf(L,score);
  const miss=act.filter(k=>!V.res[k]);
  const run=miss.some((k,j)=>miss[j+1]===k+1);
  const noScene=miss.filter(k=>!L.items[k].scene.trim()).length;
  let adv=!miss.length?"모든 자리에서 꺼내 왔습니다.":run?`${miss.map(k=>k+1).join(", ")}번에서 연달아 놓쳤습니다. 한 자리가 비면 다음 자리로 가는 길도 끊기기 쉽습니다. 그 구간의 자리들이 서로 비슷하게 생기지 않았는지 살펴보세요.`:`놓친 자리: ${miss.map(k=>`${k+1}번 ${P.loci[k]?.name||""}`).join(", ")}. 그냥 놓아두기만 했다면 움직임이나 소리, 냄새를 더해 다시 담아 보세요.`;
  if(miss.length&&noScene===miss.length&&L.items.some(x=>x.scene.trim()))adv+=" 놓친 자리는 모두 어떻게 담을지 적지 않은 곳이었습니다.";
  if(!miss.length&&m==="seq")adv+=" 다음에는 ‘섞어서’나 ‘거꾸로’로 앞 자리에 기대지 않고 떠올려 보세요.";
  const verdict=(it,k,loc)=>{
    if(m==="rev"){if(V.res[k])return `<span class="ok-t">${k+1}번 ${esc(loc.name)}</span>`;const c=V.ans[k]===""?null:+V.ans[k];return `<span class="no-t">${c===null?"고르지 않음":`${c+1}번 ${esc(P.loci[c]?.name||"")}을(를) 고름`} → 정답 ${k+1}번 ${esc(loc.name)}</span>`}
    if(V.res[k])return `<span class="${V.hint[k]?"half-t":"ok-t"}">${esc(it.text)} ${V.hint[k]?"(힌트)":""}</span>`;
    return `<span class="no-t">${V.ans[k]?`‘${esc(V.ans[k])}’ → `:""}정답 ${esc(it.text)}</span>${V.ans[k]?`<button class="btn sm plain" data-ov="${k}">맞은 걸로</button>`:""}`};
  view().innerHTML=`<div class="stack lg">
    <div class="card"><div class="row between" style="align-items:flex-end"><div><div class="eyebrow">떠올리기 결과 · ${ML}</div><div class="score">${Math.round(score*100)}%</div></div>
      <div class="small muted" style="text-align:right">${n}개 중 ${act.filter(k=>V.res[k]).length}개${V.hint.some(Boolean)?` · 힌트 ${V.hint.filter(Boolean).length}회`:""}<br>떠올린 시간 ${fmtS(V.secs)}${V.temp&&V.t0?` · 담은 시간 ${fmtS(Math.round((V.t1-V.t0)/1000))}`:""}</div></div>
      <div class="dots">${act.map(k=>`<span class="${V.res[k]?(V.hint[k]?"half":"ok"):"no"}"></span>`).join("")}</div>
      <p style="margin:0">${adv}</p>
      ${nx?`<div class="small">다음 복습: <b>${rel(nx.due)} · ${md(nx.due)}</b></div>`:""}
    </div>
    <ol class="loci rc">${act.map(k=>{const it=L.items[k],loc=P.loci[k]||{};return `<li><span class="num">${k+1}</span>${rcThumb(loc)}<span class="pl">${esc(loc.name)}${m==="rev"?` · <b>${esc(it.text)}</b>`:""}</span>
      <span class="verdict">${verdict(it,k,loc)}${!V.res[k]&&it.scene.trim()?`<span class="muted">담은 모습: ${esc(it.scene)}</span>`:""}</span></li>`}).join("")}</ol>
    <button class="btn wide" id="finish">${V.temp?"기록하고 연습으로":"기록하고 마치기"}</button>
  </div>`;
  on("[data-ov]","click",(e,b)=>{V.res[+b.dataset.ov]=true;render()});
  on("#finish","click",()=>{
    markUsed(L.palaceId);if(V.temp){db.drills.push({d:Date.now(),score,n,ok:act.filter(k=>V.res[k]).length,secs:V.secs,kind:V.temp.kind,mode:m,limit:V.temp.limit||0,group:V.temp.group||1,digits:V.temp.digits||0,build:V.t0?Math.round((V.t1-V.t0)/1000):0,palaceId:L.palaceId});db.drills=db.drills.slice(-200);save();go("drill");return}
    L.reviews.push({d:Date.now(),score,mode:m});Object.assign(L,nx);save();toast(`다음 복습은 ${md(nx.due)}입니다`);go("today");
  });
};

function resizePhoto(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=480,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

VIEWS.place=()=>{
  const P=pal(V.pid);if(!P||!P.loci.length)return go("palace",{pid:V.pid});
  const n=P.loci.length,i=Math.min(V.i||0,n-1),loc=P.loci[i];
  const lists=db.lists.filter(l=>l.palaceId===P.id);
  if(V.lid===undefined||(V.lid!=="new"&&!lst(V.lid)))V.lid=(lists[0]||{id:"new"}).id;
  const L=V.lid==="new"?null:lst(V.lid);
  const it=(L&&L.items[i])||{text:"",scene:""};
  const others=lists.filter(l=>l!==L&&l.items[i]&&l.items[i].text.trim()).map(l=>`<b>${esc(l.items[i].text)}</b> (${esc(l.title)})`);
  const filled=L?active(L):[];
  view().innerHTML=`<div class="stack">
    <div class="row between"><div class="eyebrow">자리에 담기 · ${esc(P.name)}</div><span class="small muted">${i+1} / ${n}</span></div>
    <div class="dots">${P.loci.map((_,k)=>`<span class="${k===i?"on":filled.includes(k)?"ok":""}"></span>`).join("")}</div>
    <div class="locus ${loc.photo?"":"nophoto"}">${loc.photo?`<img src="${loc.photo}" alt="">`:""}<div class="cap"><b>${String(i+1).padStart(2,"0")}</b><span>${esc(loc.name||"(이름 없는 자리)")}</span></div></div>
    <label class="f">어느 목록에 담을까요<select id="plList">${lists.map(l=>`<option value="${l.id}" ${l.id===V.lid?"selected":""}>${esc(l.title)}</option>`).join("")}<option value="new" ${V.lid==="new"?"selected":""}>＋ 새 목록 만들기</option></select></label>
    ${V.lid==="new"?`<label class="f">새 목록 이름<input type="text" id="plTitle" value="${esc(V.newTitle||"")}" placeholder="예: 파이 100자리"></label>`:""}
    <label class="f">외울 것<input type="text" id="plText" value="${esc(it.text)}" placeholder="이 자리에 담을 것" autocomplete="off"></label>
    <label class="f">어떻게 담을까요<textarea id="plScene" rows="3" placeholder="크게, 움직이게, 소리나 냄새까지. 예: ${esc(loc.name||"이 자리")}에서 …">${esc(it.scene)}</textarea></label>
    ${others.length?`<div class="small muted">이 자리에 다른 목록으로 담긴 것: ${others.join(", ")}</div>`:""}
    <div class="row"><button class="btn plain" id="plPrev" ${i?"":"disabled"}>이전 자리</button><button class="btn" id="plNext" ${i<n-1?"":"disabled"}>다음 자리</button></div>
    <div class="row between"><button class="btn ghost" id="plDone">다 담았어요 · 떠올리기</button><button class="btn sm plain" id="plBack">궁전으로</button></div>
  </div>`;
  const getL=()=>{if(V.lid!=="new")return lst(V.lid);const nl={id:uid(),title:(V.newTitle||"").trim()||`${P.name} 목록`,palaceId:P.id,items:[],built:false,stage:-1,due:today(),reviews:[],created:Date.now()};db.lists.unshift(nl);V.lid=nl.id;return nl};
  const slot=()=>{const T=getL();while(T.items.length<=i)T.items.push({text:"",scene:""});return T.items[i]};
  on("#plList","change",(e,t)=>{V.lid=t.value;render()});
  on("#plTitle","input",(e,t)=>{if(V.lid==="new")V.newTitle=t.value;else{const T=lst(V.lid);if(T&&t.value.trim())T.title=t.value.trim();save()}});
  on("#plText","input",(e,t)=>{slot().text=t.value;save()});
  on("#plScene","input",(e,t)=>{slot().scene=t.value;save()});
  on("#plText","keydown",(e)=>{if(e.key==="Enter"){e.preventDefault();$("#plScene").focus()}});
  on("#plPrev","click",()=>{V.i=i-1;render()});on("#plNext","click",()=>{V.i=i+1;render()});
  on("#plBack","click",()=>go("palace",{pid:P.id}));
  on("#plDone","click",()=>{const T=V.lid==="new"?null:lst(V.lid);if(!T||!active(T).length)return toast("이 목록에 담은 것이 아직 없습니다.");T.built=true;save();startRecall(T)});
  const f=$("#plText");if(f&&!it.text)f.focus();
};

      </div>
      <div class="small muted" id="dInfo"></div>
      <button class="btn" id="dGo">시작</button>
    </div>
    <div class="card stack"><div class="row between"><h2>숫자 짝표</h2><span class="pill ${f===100?"ok":"warn"}">${f} / 100</span></div>
      <div class="small">00부터 99까지 두 자리 숫자마다 떠올릴 이미지를 하나씩 정해 둡니다. 숫자를 담을 때는 숫자 대신 이 이미지를 자리에 놓습니다.</div>
      <div class="row"><button class="btn sm" id="goNT">짝표 ${f?"고치기":"만들기"}</button><button class="btn sm plain" id="goFlash" ${f<10?"disabled":""}>짝표 속도 연습</button></div>
      ${f<10?`<div class="small muted">10개 이상 정하면 속도 연습을 할 수 있습니다.</div>`:db.flash.length?`<div class="small muted">최근 평균 <span class="tnum">${(db.flash.at(-1).avg/1000).toFixed(2)}</span>초 · 최고 <span class="tnum">${(Math.min(...db.flash.map(x=>x.avg))/1000).toFixed(2)}</span>초</div>`:""}
    </div>
    <div class="stack"><div class="eyebrow">최고 기록</div>
      ${bests.length?bests.map(r=>`<div class="row between small"><span>${recLabel(r)}</span><span class="tnum">${r.c}/${r.n} · 떠올림 ${fmtS(r.secs)}</span></div>`).join(""):`<div class="small muted">아직 기록이 없습니다.</div>`}</div>
    <div class="stack"><div class="eyebrow">최근 기록</div>
      ${log.length?log.map(r=>`<div class="row between small"><span>${md(r.d)} · ${recLabel(r)}</span><span class="tnum">${Math.round(r.score*100)}%${r.build?` · 담기 ${fmtS(r.build)}`:""}</span></div>`).join(""):`<div class="small muted">아직 기록이 없습니다.</div>`}</div>
    <div class="tip"><b>궁전 돌려 쓰기</b> 방금 쓴 궁전을 바로 다시 쓰면 앞서 담은 이미지가 남아 섞입니다. 선수들은 궁전을 여러 개 두고 며칠씩 쉬게 하며 돌려 씁니다. 가장 오래 쉰 궁전이 먼저 골라져 있습니다.</div>
  </div>`;
  const upd=()=>{const Pp=pal($("#dPal").value),k=$("#dKind").value,num=k==="number"||k==="pi",g=num?+$("#dGroup").value:1;
    $("#dGroupWrap").hidden=!num;$("#dNL").textContent=num?"숫자 개수":"개수";
    const cap=Pp?Pp.loci.length*g:0;
    $("#dInfo").textContent=Pp?`이 궁전에는 최대 ${k==="pi"?Math.min(cap,100):cap}${num?"자리":"개"}까지 담을 수 있습니다.${num&&numFilled().length<100?" 숫자 짝표를 먼저 채워 두면 훨씬 수월합니다.":""}`:"";
    const d=Pp?daysAgo(db.used[Pp.id]):null;$("#dRest").innerHTML=d===0?`<span class="half-t">오늘 이미 쓴 궁전입니다. 앞서 담은 것이 섞일 수 있습니다.</span>`:"";};
  on("#dPal","change",(e,t)=>{V.dp=t.value;upd()});on("#dKind","change",()=>{const k=$("#dKind").value;$("#dN").value=k==="number"||k==="pi"?20:10;upd()});on("#dGroup","change",upd);upd();
  on("#goNT","click",()=>go("numtable"));on("#goFlash","click",()=>go("flash"));
  on("#dGo","click",()=>{
    const Pp=pal($("#dPal").value);if(!Pp||Pp.loci.length<3)return toast("자리가 3곳 이상인 궁전이 필요합니다.");
    const k=$("#dKind").value,num=k==="number"||k==="pi",g=num?+$("#dGroup").value:1,limit=+$("#dLimit").value;
    let cnt=Math.max(num?g:3,+$("#dN").value||10);const cap=k==="pi"?Math.min(100,Pp.loci.length*g):Pp.loci.length*g;
    if(cnt>cap){cnt=cap;toast(`${cap}${num?"자리":"개"}까지만 담을 수 있어 그만큼으로 줄였습니다.`)}
    let items;
    if(k==="word")items=shuffle(WORDS).slice(0,cnt);
    else if(k==="abstract")items=shuffle(ABSTRACT).slice(0,cnt);
    else{const digits=k==="pi"?PI100.slice(0,cnt):Array.from({length:cnt},()=>Math.floor(Math.random()*10)).join("");items=[];for(let i=0;i<digits.length;i+=g)items.push(digits.slice(i,i+g))}
    const dg=num?items.join("").length:0;
    const T={id:"temp",title:`연습 · ${KIND[k]} ${num?`${dg}자리`:`${items.length}개`}${limit?` · ${limit/60}분`:""}`,palaceId:Pp.id,kind:k,group:g,limit,digits:dg,items:items.map(t=>({text:t,scene:""}))};
    go("build",{temp:T,i:0,t0:Date.now()});
  });
};

/* ----- 숫자 짝표 ----- */
VIEWS.numtable=()=>{
  const st=db.numStats;
  view().innerHTML=`<div class="stack lg">
    <div class="row"><button class="btn sm plain" id="ntBack">← 연습</button></div>
    <div class="stack" style="gap:4px"><div class="eyebrow">숫자 짝표 · ${numFilled().length} / 100</div><h1>두 자리 숫자마다 이미지 하나</h1></div>
    <div class="tip"><b>예시 규칙</b> 숫자를 자음으로 바꿉니다. 0ㅇ 1ㄱ 2ㄴ 3ㄷ 4ㄹ 5ㅁ 6ㅂ 7ㅅ 8ㅈ 9ㅊ. 두 자음으로 시작하는, 눈에 그려지는 말을 고르세요. 예: 14 ㄱㄹ → 고래, 59 ㅁㅊ → 망치. 규칙은 바꿔도 되지만, 한 번 정한 이미지는 자주 바꾸지 않는 게 좋습니다.</div>
    <div class="small muted">황토색 테두리는 속도 연습에서 느리거나 자주 막힌 숫자입니다. 더 선명한 말로 바꿔 보세요.</div>
    <div class="ntgrid">${NN.map(nn=>{const x=st[nn];const slow=x&&x.n>=2&&(x.ms/x.n>2500||x.miss/x.n>.3);return `<label class="nt ${slow?"slow":""}"><span class="num">${nn}</span><span class="cons">${consOf(nn)}</span><input type="text" data-nn="${nn}" value="${esc(db.numImg[nn]||"")}" placeholder="이미지" autocomplete="off" aria-label="${nn} 이미지"></label>`}).join("")}</div>
  </div>`;
  on("#ntBack","click",()=>go("drill"));
  on("[data-nn]","input",(e,t)=>{db.numImg[t.dataset.nn]=t.value;save()});
  on("[data-nn]","keydown",(e,t)=>{if(e.key==="Enter"){e.preventDefault();const nx=view().querySelector(`[data-nn="${NN[+t.dataset.nn+1]}"]`);if(nx)nx.focus()}});
};

/* ----- 짝표 속도 연습 ----- */
function flashQueue(){const f=numFilled();const w=nn=>{const x=db.numStats[nn];if(!x||!x.n)return 2;return 1+3*(x.miss/x.n)+Math.min(3,(x.ms/x.n)/1000)};return f.map(nn=>({nn,k:Math.random()**(1/w(nn))})).sort((a,b)=>b.k-a.k).slice(0,Math.min(20,f.length)).map(x=>x.nn)}
VIEWS.flash=()=>{
  if(!V.q){V.q=flashQueue();V.i=0;V.res=[];V.shown=Date.now();V.rev=false}
  if(V.i>=V.q.length)return flashDone();
  const nn=V.q[V.i];
  view().innerHTML=`<div class="stack lg">
    <div class="row between"><div class="eyebrow">짝표 속도 연습</div><span class="small muted">${V.i+1} / ${V.q.length}</span></div>
    <div class="dots">${V.q.map((_,k)=>`<span class="${k<V.i?(V.res[k].ok?"ok":"no"):k===V.i?"on":""}"></span>`).join("")}</div>
    <div class="card" style="align-items:center;padding:30px 14px;gap:6px"><div class="flashnum">${nn}</div><div class="muted small">${consOf(nn)}</div>
      ${V.rev?`<div class="item" style="padding:6px 0 0">${esc(db.numImg[nn])}</div><div class="small muted tnum">${(V.ms/1000).toFixed(2)}초</div>`:""}</div>
    ${V.rev?`<div class="row" style="flex-wrap:nowrap"><button class="btn" id="fOk" style="flex:1">바로 떠올렸어요</button><button class="btn plain" id="fNo" style="flex:1">막혔거나 틀렸어요</button></div>`:`<button class="btn wide" id="fShow">떠올랐으면 누르세요</button>`}
    <div class="small muted">숫자를 보고 이미지가 머릿속에 그려지는 순간 누르세요. 그 순간까지 시간을 잽니다.</div>
  </div>`;
  on("#fShow","click",()=>{V.ms=Date.now()-V.shown;V.rev=true;render()});
  const mark=ok=>{const x=db.numStats[nn]||(db.numStats[nn]={n:0,ms:0,miss:0});x.n++;x.ms+=V.ms;if(!ok)x.miss++;V.res.push({nn,ms:V.ms,ok});V.i++;V.rev=false;V.shown=Date.now();save();render()};
  on("#fOk","click",()=>mark(true));on("#fNo","click",()=>mark(false));
};
function flashDone(){
  const r=V.res,okr=r.filter(x=>x.ok),avg=okr.length?okr.reduce((a,x)=>a+x.ms,0)/okr.length:0;
  const prevBest=db.flash.length?Math.min(...db.flash.map(x=>x.avg)):Infinity;
  if(!V.saved){V.saved=true;if(okr.length){db.flash.push({d:Date.now(),avg,n:r.length,ok:okr.length});db.flash=db.flash.slice(-100)}save()}
  const slow=r.slice().sort((a,b)=>(a.ok-b.ok)||(b.ms-a.ms)).slice(0,5);
  view().innerHTML=`<div class="stack lg">
    <div class="card"><div class="eyebrow">짝표 속도 연습 결과</div><div class="score tnum">${okr.length?(avg/1000).toFixed(2)+"초":"–"}</div>
      <div class="small muted">바로 떠올린 것의 평균 · ${r.length}개 중 ${okr.length}개${okr.length&&avg<prevBest?" · 최고 기록":""}</div>
      <div class="small">선수들은 숫자를 보는 순간 이미지가 떠오를 때까지 이 연습을 되풀이합니다. 평균 1초 안쪽을 첫 목표로 삼아 보세요.</div></div>
    <div class="stack"><div class="eyebrow">느렸거나 막힌 숫자</div>${slow.map(x=>`<div class="row between small"><span><b class="tnum">${x.nn}</b> ${esc(db.numImg[x.nn]||"")}</span><span class="${x.ok?"muted":"no-t"} tnum">${(x.ms/1000).toFixed(2)}초${x.ok?"":" · 막힘"}</span></div>`).join("")}</div>
    <div class="small muted">자주 막히는 숫자는 다음 연습에 더 자주 나옵니다.</div>
    <div class="row"><button class="btn" id="fAgain">한 번 더</button><button class="btn plain" id="fNT">짝표 고치기</button><button class="btn plain" id="fBack">연습으로</button></div>
  </div>`;
  on("#fAgain","click",()=>go("flash"));on("#fNT","click",()=>go("numtable"));on("#fBack","click",()=>go("drill"));
}
document.addEventListener("keydown",e=>{if(!V||V.name!=="flash"||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if((e.key===" "||e.key==="Enter")&&$("#fShow")){e.preventDefault();$("#fShow").click()}
  else if(e.key==="1"&&$("#fOk"))$("#fOk").click();else if(e.key==="2"&&$("#fNo"))$("#fNo").click()});

view().innerHTML=`<div class="empty">불러오는 중…</div>`;
load().then(d=>{db=d;if(!db.settings.seenGuide)V={name:"guide"};render();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}});
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude\.ai|claudeusercontent/.test(location.hostname)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
